<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rock,Paper,Scissors</title>
</head>
<body>
    <div class="game-card">
    <script src="script.js" defer></script>
    <!--header-->
    <div class="head-bar">
        <h1>Welcome to rock paper scissors</h1>
    </div>
    <!--score bord-->
    <div class="score-bored">
        <div id="human-score">Player: 0</div>
        <div id="pc-score">Computer: 0</div>
    </div>

    <!--choices bored-->
    <div id="Choices">
        <button id="rock"><img src="Images/Rock.png" alt="Rock"></button>
        <button id="paper"><img src="Images/Paper.png" alt="Paper"></button>
        <button id="scissors"><img src="Images/Scissors.png" alt="Scissors"></button>
    </div>
    <p id="game-message">Choose your wepon!</p>
    
    <!--rounds left-->
    <div id="rounds-left">Rounds left: 5</div>
    <!--footer-->
    </div>
</body>
</html>
